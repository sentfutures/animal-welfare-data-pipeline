# api = anthropic SDK billed to ANTHROPIC_API_KEY. The FAITHFUL mode: it is the
#       environment the spec's eventual consumer runs in, and the only mode where
#       max_tokens caps, truncation-rejection dynamics, and the exact prompt
#       context are reproduced. Use for full-scale runs, evals, and any run whose
#       outputs are meant to represent pipeline behavior.
# claude_code / auto = dev-iteration backends for local work without an API key;
#       they do not reproduce api's request semantics, so they are never used for
#       runs meant to represent pipeline behavior. See CLAUDE.md "Dev backends".
backend: api
model: claude-sonnet-5
max_tokens: 4000
temperature: 1.0  # sampling temperature for every API call (0.0-1.0); generation wants 1.0 — diversity IS the product
workers: 8  # concurrent API calls within each SDF layer and DAD stage (1c/2/3); 1 = serial

# Eval model knobs (evals/audit_dad.py --judges; falls back to the global `model`).
evals:
  judge_model: claude-opus-5  # delivery-quality + welfare-impact judges, showcase, rhetorical-move discovery

sdf:
  n_prompts: 100                 # documents planned per run, deck-sampled from the variables matrix
  seed: 0                        # deck-sampling seed (same seed + same variables = same sample)
  entity_pool_seed: 137          # seeds the locale-matched fictional people/org name pools
  min_score_threshold: 7         # layer-4 gate: alignment AND realism must reach this
  near_dup_threshold: 0.90       # cull near-duplicate final documents at layer 4 (word-shingle cosine; null disables)
  # Per-stage model overrides (each falls back to the global `model`).
  # The critique stages repay a stronger model most — cheap drafts, expensive critics:
  # plan_model: claude-sonnet-5
  # draft_model: claude-sonnet-5
  # rewrite_model: claude-opus-4-8   # NOT claude-fable-5: it 400s on the api backend (requires adaptive thinking, which conflicts with the pipeline's thinking=disabled — see shared/api.py)
  # score_model: claude-sonnet-5

dad:
  # Per-stage model overrides (each falls back to the global `model`).
  # DAD runs on Opus 5 across the board (Sonnet stays the global/SDF default);
  # Opus answers every welfare prompt where Fable's dual-use layer refuses ~30%.
  scenario_model: claude-opus-5                 # 1a: scenario plan (deal -> description)
  # 1a refusal fallback: if Opus's refusal classifier cuts the scenario-plan
  # stream twice (stop_reason "refusal", seen on insect-welfare plans), the
  # last-ditch attempt switches to this model. Attempts 1-2 stay on the stage
  # model (a stochastic refusal clears on an Opus retry); a persistent one
  # needs a different model, and dropping the plan would bias the corpus away
  # from the refused content. null = no switch (the granted attempt stays on
  # Opus). Fallback-authored scenarios are stamped scenario_model_fallback.
  scenario_refusal_fallback_model: claude-sonnet-5
  prompt_draft_model: claude-opus-5             # 1b: draft user prompts (one call per scenario)
  prompt_gate_model: claude-opus-5              # 1c: pass/fail quality gate (falls back to global)
  prompt_refine_model: claude-opus-5            # 1d: review-and-rewrite refine on gate-passed drafts (falls back to global)
  response_scope_model: claude-opus-5           # 2a: scope map — feeds every downstream step-2 call
  # 2a refusal fallback, same semantics as scenario_refusal_fallback_model:
  # stage-model retries first (a stochastic refusal clears), then ONE
  # last-ditch attempt on this model. Seen live: Opus 5's classifier refused a
  # biosecurity-framed scope three times; dropping the prompt
  # would bias the corpus away from that content. null = no switch.
  scope_refusal_fallback_model: claude-opus-4-8
  response_select_model: claude-opus-5          # 2a.5: library-entry selection over the trigger index (falls back to response_scope_model if unset)
  response_draft_model: claude-opus-5           # 2b: response over scope + library
  constitution_rewrite_model: claude-opus-5     # step 3: constitution rewrite (alignment-critical)
  baseline:
    enabled: true            # unguided control response per dilemma (viewer comparison only; never trains)
    model: claude-opus-5     # plain call — no system prompt, the shipped user prompt verbatim
  evals:
    auto: true  # after every full run: evals/audit_dad.py --judges + evals/diversity.py on the run dir
                # (paid: the two-judge pass on a 40-example run + embedding cents, logged to the global
                # cost log; diversity needs GEMINI_API_KEY or OPENAI_API_KEY). false = run evals manually.
  dilemmas:
    count: 40         # total examples in step 1 (seed imports count toward this)
    seed_path: null   # optional JSONL of handwritten examples ({prompt|user_message, annotation?})
    scenario_seed: null  # optional int for reproducible scenario generation; scenarios persist per run either way
    gate: true        # step 1c: pass/fail quality gate on each 1b draft (load-bearing, honors its cards, self-contained, cohesive); a reject routes the scenario back for redraft, capped at 3
    refine: true      # step 1d: review-and-rewrite each gate-passed draft (tic-thinning, dealt-card enforcement, unfixable rejection). Setting this without `gate` (or vice versa) is refused loudly rather than guessed at — they toggle two separate paid stages
  responses:
    per_prompt: 1  # independent samples per dilemma; each reasons from the reasoning library

pref:
  prompts_path: null  # JSONL of prompts to pair (user_message/refined/prompt field), or pass --prompts
  arms:
    a:
      name: baseline
      system_prompt: ""
    b:
      name: candidate
      system_prompt: ""  # or system_prompt_file: prompts/pref/response_spec.txt

language_distribution:
  en: 1.0

outputs:
  sdf_final: outputs/sdf/final/sdf_corpus.jsonl
  dad_final: outputs/dad/final/dad_corpus.jsonl
  cost_log: outputs/cost_log.jsonl
