# SDF human-profile smoke config using the pushed dataset's model setup
# (run 2026-07-25_15-57_fullscale-500-opus5: global Sonnet 5 with the layer-3/4
# rewrite on Opus 5 — the only Opus stage; the critique half falls back to
# rewrite_model, so both critique and rewrite run on Opus 5). That run was made
# on the claude_code backend; api is the faithful mode and the committed default.
backend: claude_code  # subscription-billed dev backend; matches the pushed SDF run's own provenance
model: claude-sonnet-5
max_tokens: 4000
temperature: 1.0
workers: 8

# Eval model knobs (evals/audit_dad.py --judges; falls back to the global `model`).
evals:
  judge_model: claude-opus-5

sdf:
  profile: human                 # sdf_pipeline/profiles/human.py; prompts/sdf_human/, outputs/sdf_human/
  n_prompts: 2  # english redo of the pt/hi hands from 2026-11-14_10-47_human-smoke-5 (deal seeded by hand)
  seed: 0
  entity_pool_seed: 137
  min_score_threshold: 7
  near_dup_threshold: 0.90
  screen_enabled: true
  screen_batch_size: 10
  screen_redeal_rounds: 3
  # off: no OpenAI key available, and the pushed SDF run predates this stage
  description_rewrite_enabled: false
  description_rewrite_model: gpt-6.1-sol
  description_rewrite_reasoning_effort: medium
  select_enabled: true
  max_scoring_attempts: 3
  minimum_assignable_score: 3
  max_moral_considerations_per_document: 3
  max_epistemic_considerations_per_document: 3
  max_considerations_per_document: 4
  score_weights: {3: 1, 4: 3, 5: 9}
  extra_consideration_penalty: 2
  select_skip_no_stake: true
  rewrite_model: claude-opus-5   # the pushed run's one override; critique falls back here too
  revision:
    split: true
    style_mode: axes
    use_length: true

dad:
  profile: animal
  scenario_model: claude-opus-5-5
  scenario_refusal_fallback_model: claude-sonnet-5-5
  prompt_draft_model: claude-opus-5-5
  prompt_gate_model: claude-sonnet-5-5
  prompt_refine_model: claude-opus-5-5
  response_scope_model: claude-opus-5-5
  scope_refusal_fallback_model: claude-opus-4-8
  response_select_model: claude-opus-5-5
  response_draft_model: claude-opus-5-5
  constitution_rewrite_model: claude-opus-5-5
  baseline:
    enabled: true
    model: claude-opus-5-5
  evals:
    auto: true
  dilemmas:
    count: 40
    seed_path: null
    scenario_seed: null
    gate: true
    refine: true
  responses:
    per_prompt: 1

pref:
  prompts_path: null
  arms:
    a:
      name: baseline
      system_prompt: ""
    b:
      name: candidate
      system_prompt: ""

language_distribution:
  en: 1.0

outputs:
  sdf_final: outputs/sdf/final/sdf_corpus.jsonl
  dad_final: outputs/dad/final/dad_corpus.jsonl
  cost_log: outputs/cost_log.jsonl
