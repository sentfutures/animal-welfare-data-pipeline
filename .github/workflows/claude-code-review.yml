name: Claude Code Review

on:
  pull_request:
    # `edited` fires when a PR's base branch changes (e.g. a stacked PR
    # auto-retargeting to main after its parent merges). GitHub dismisses the
    # standing approval on retarget ("The base branch was changed."), so the
    # review must re-run then — the job-level guard below skips the
    # title/body-only edits that also arrive as `edited`.
    types: [opened, synchronize, ready_for_review, reopened, edited]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Fork PRs can't access secrets/OIDC on the pull_request trigger, so the
    # review can't authenticate and the job always fails. Skip them here; forks
    # are reviewed on demand via an `@claude` comment (see claude.yml) instead.
    # For `edited` events, only run when the base branch changed (the payload's
    # `changes.base` is present only then) — not on title/body edits.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null)

    # One review per PR at a time, and only the newest push gets a verdict.
    # Without this, a burst of pushes stacks reviews and the PR accumulates
    # contradictory verdicts for superseded commits (PR #104: ten verdicts in
    # 2h09m, flip-flopping request-changes -> comment -> approve), which leaves
    # the author unable to tell which one is current. Cancelling in progress is
    # why the verify step below must guard on `!cancelled()`.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The action reports the job as successful the moment the agent process
      # ends, even when it posted no verdict (see the verify step at the end).
      # Record a start time so that step can require a *fresh* verdict — backdated
      # 60s to absorb runner/GitHub clock skew, and to exclude any stale review
      # left at the same head SHA by a previous run (e.g. after a base retarget).
      - name: Record review start time
        id: review-start
        run: echo "ts=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Print the full SDK stream into the job log. Without this, a turn-1
          # auth failure is undiagnosable from CI: the action logs only redacted
          # init/result events (no error text), a debug-mode rerun adds nothing,
          # and no artifact is uploaded — while any PR editing this workflow
          # makes the action self-skip, so the setting must already be on main
          # before a failure happens. The stream contains only what the review
          # agent says and runs; the OAuth token itself is masked by Actions.
          show_full_output: true
          # Also review commits pushed by bots (e.g. a fix pushed by claude[bot]).
          # Without this the action rejects bot-initiated runs. Narrow to specific
          # bot names instead of '*' if you want to restrict which bots trigger it.
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in
            the current working directory. Inspect the changes with
            `gh pr diff`. To read individual files, use the Read, Grep, and
            Glob tools — do NOT use git, cat, sed, grep, or find via Bash: only
            the `gh pr` subcommands below are permitted, and any other Bash
            command is denied and just wastes turns.

            Some PRs commit fresh pipeline-run output under `outputs/**` as
            reviewable examples (see CLAUDE.md's "Committed run outputs are
            deliberate" section) — this is generated data, not hand-authored
            code, and a single run can add thousands of lines of JSONL. Run
            `gh pr diff --name-only` first; if any changed paths are under
            `outputs/`, skim past those hunks in the full diff without
            analyzing their content, and just note the file/line count in
            your summary. Spend your review effort on the non-generated code
            paths only.

            Focus on high-signal problems in the changed code only:
            - Bugs, logic errors, and unhandled edge cases
            - Security issues
            - Clear violations of guidelines in any relevant CLAUDE.md (root or a
              CLAUDE.md in a parent directory of the changed file)

            Skip nitpicks, style preferences, and pre-existing issues.

            You cannot run tests, and that is never a reason to avoid a
            verdict: the `smoke` check runs `compileall` plus the full pytest
            suite against this head commit. Read its result with
            `gh pr view ${{ github.event.pull_request.number }} --json statusCheckRollup`:
            - SUCCESS — the suite passes. Do not call your review unverified
              merely because you did not run pytest yourself.
            - FAILURE — that is a significant issue on its own. Request
              changes and say which check failed.
            - Still pending — review the code on its merits and say in one
              line that `smoke` had not finished. Pending tests are not
              grounds for withholding a verdict.

            Leave feedback with `mcp__github_inline_comment__create_inline_comment`
            for each specific issue (one comment per issue, on the relevant line).

            Then submit exactly ONE formal review verdict for PR
            #${{ github.event.pull_request.number }}. First write your summary
            to a file named `review-body.md` in the repository root using the
            Write tool (this keeps the command below free of shell quoting).

            Your verdict MUST agree with your own summary. Before running the
            command, re-read what you wrote:
            - If your summary says the changes are correct, that you found no
              bugs / security issues / CLAUDE.md violations, or describes what
              you found as "minor", "not blocking", "not a blocker", "a nit",
              or "worth a follow-up" — that is an APPROVAL. Approve.
            - If your summary says something should be fixed "before merge",
              calls anything a "real bug", or gives the author an imperative
              ("either wire a consumer or fix the comment") — that is a CHANGE
              REQUEST. Request changes.
            - Do NOT write a summary that states one verdict and then file a
              different one. A finding you are unwilling to block on is an
              approval with a note, not a neutral review.

            "Significant" means it would produce wrong output, corrupt or
            delete data, leak a secret, cost money unexpectedly, break a
            documented interface, or violate an explicit CLAUDE.md
            requirement. Anything else is not significant.

            Run ONE of these — nothing else:
            - Significant issues found:
              `gh pr review ${{ github.event.pull_request.number }} --request-changes --body-file review-body.md`
            - Correct, no significant issues:
              `gh pr review ${{ github.event.pull_request.number }} --approve --body-file review-body.md`
            - The decision is not yours to make even in principle — a product,
              research, or cost/quality tradeoff, or a public-facing breaking
              change needing an owner's sign-off:
              `gh pr review ${{ github.event.pull_request.number }} --comment --body-file review-body.md`
              If you use this, the body MUST open with the single specific
              question a human has to answer. This verdict fails the review
              check and requests review from a maintainer, so never reach for
              it to avoid choosing.
            Always use `--body-file`; never pass the summary inline with
            `--body "..."`. Do NOT use command substitution `$(...)`, pipes, or
            heredocs in any command — they are blocked in this environment and
            the command will silently fail to run. Never merge the PR; a human
            decides whether to merge.
          # The action denies comment-posting tools by default; grant the inline
          # comment tool plus the gh subcommands the review needs, or it reviews
          # but cannot post its findings. `Write` lets the review compose its
          # summary into review-body.md for `gh pr review --body-file` — a plain
          # `--body "..."` carrying a multi-line or command-substituted string is
          # blocked in headless CI (it isn't covered by the Bash allow-rule and
          # can't be interactively approved). Write grants runner-wide write,
          # acceptable here: the job is `contents: read`, ephemeral, and the PR
          # checkout is already treated as untrusted.
          #
          # --disallowedTools "Task": the review agent can spawn parallel
          # sub-agents (Task tool) to split up a large diff. Task's default
          # background execution assumes an interactive harness that resumes
          # the model when a sub-agent finishes; this action runs one
          # non-interactive turn with no such resume, so the model's turn just
          # ends while sub-agents are still running mid-review (PR #73: the
          # action exited "success" after the model said "Waiting for the
          # three background review agents to finish before continuing" and
          # never posted a verdict). Blocking Task keeps the review
          # single-threaded and synchronous end-to-end.
          # `Bash(gh pr comment:*)` was dropped: the verdict body is the
          # summary channel, and across nine high-traffic PRs the review had
          # never once posted a plain comment. Keeping it only offered a
          # weaker exit than the three verdicts.
          claude_args: |
            --allowedTools "Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Task"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Turn the action's false-green into a hard failure: confirm a claude[bot]
      # review for THIS head commit was submitted during this run, and fail the
      # check loudly if not (the action exposes no "verdict posted" signal). A
      # read of the reviews API only needs the default token's pull-requests read.
      #
      # This step also decides the check's colour from the verdict's *state*. A
      # neutral (COMMENTED) verdict supplies zero of the one approval `main`
      # requires, so it leaves the PR unmergeable — but it used to leave this
      # check green, which is how PR #82 sat for 17 days with two green checks,
      # a body opening "Real bug found:", and nothing for the author to click.
      # Neutral now fails the check and escalates (see the next step).
      #
      # `!cancelled()` matters: `always()` fires on cancelled jobs too, and the
      # job-level concurrency above cancels superseded runs. Without the guard a
      # cancelled run would report a missing verdict and escalate spuriously.
      - name: Verify a review verdict was posted
        id: verdict
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SINCE: ${{ steps.review-start.outputs.ts }}
          ACTION_OUTCOME: ${{ steps.claude-review.outcome }}
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          # Only enforce when the action actually ran a review. The action
          # self-skips — exiting "success" with no execution output — when it
          # cannot run, most commonly on a PR that edits this workflow (the
          # action requires the file to match the default branch). That is not a
          # review failure. The original bug is distinguishable: there the action
          # ran to completion (an execution_file exists) but posted no verdict.
          if [ "${ACTION_OUTCOME}" != "success" ]; then
            echo "::notice::Claude action outcome was '${ACTION_OUTCOME}'; the job status already reflects that. Skipping verdict check."
            exit 0
          fi
          if [ -z "${EXEC_FILE}" ]; then
            # A self-skip means this PR got NO automated review at all. The check
            # deliberately stays green (663c7e2: a red X the author cannot act on
            # is noise), but staying silent is what made this indistinguishable
            # from a reviewed PR: on the PR page a self-skip reads as a fast
            # green `claude-review`, and a guard-skipped no-op re-run after a
            # real review reads as `skipping`. Neither tells you whether anyone
            # looked. So record it as a verdict state and let the escalation step
            # label the PR and request a human — the same routing a neutral
            # verdict gets, for the same reason: a human has to do the reviewing.
            echo "verdict=NOT_REVIEWED" >> "$GITHUB_OUTPUT"
            echo "::warning::This PR received no automated review — the action self-skipped, which happens when a PR edits the review workflow (the action only runs the copy on the default branch). Requesting a human reviewer instead."
            exit 0
          fi
          if [ -z "${SINCE}" ]; then
            echo "::error::No start timestamp was recorded; cannot verify the review."
            exit 1
          fi
          # Poll briefly for API read-after-write consistency. submitted_at is
          # ISO-8601 UTC, so the >= string compare against SINCE is correct.
          #
          # `(.body|length) > 0` is load-bearing, not defensive. Every inline
          # comment the review posts also lands in this endpoint as its own
          # review object with an EMPTY body and state COMMENTED — 152 of the
          # 351 claude reviews on PRs #59-#118 are these artifacts. Reading
          # `.state` without the body filter would classify almost every
          # review, including approvals, as neutral. Take the LAST bodied
          # review: that is the formal verdict.
          #
          # Pages are merged by `jq -s 'add'` BEFORE filtering. `gh api
          # --paginate --jq` applies the filter to each page separately, so
          # `last` would run per page and the substitution would join each
          # page's own answer — making `$verdict` a multi-line string that
          # matches no `case` arm below, so a real verdict would be reported as
          # "posted no verdict" and the check would fail on a healthy review.
          # Needs >100 review objects on one PR (`--paginate` requests
          # per_page=100); the busiest so far, #65, has 48, so this is
          # headroom rather than a live failure — but every inline comment adds
          # a review object, so a long-iterated PR gets there. `--slurp` cannot
          # be used: gh rejects it when combined with `--jq`. This matches the
          # idiom claude-review-fix.yml already uses in four places.
          for attempt in 1 2 3 4 5 6; do
            verdict=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" --paginate \
              | jq -r -s 'add // [] | [.[] | select(.commit_id==env.HEAD_SHA and .submitted_at>=env.SINCE and (.user.login|test("claude";"i")) and (.body|length) > 0)] | last | .state // ""')
            if [ -n "${verdict}" ]; then
              break
            fi
            echo "No verdict yet (attempt ${attempt}/6); waiting…"
            sleep 10
          done
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          case "${verdict}" in
            APPROVED|CHANGES_REQUESTED)
              echo "✓ Claude submitted a ${verdict} verdict for ${HEAD_SHA}."
              # Clear a stale escalation from an earlier neutral verdict on this
              # PR; the bot has since committed to a binary call. 404 when the
              # label isn't present is the normal case, hence the discard.
              gh api -X DELETE \
                "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/needs-human-review" \
                >/dev/null 2>&1 || true
              exit 0
              ;;
            COMMENTED)
              echo "::error::Claude reached no binary verdict for ${HEAD_SHA} — it neither approved nor requested changes, so this PR cannot merge on its own. The review body names the question a human has to answer; the next step requests that review."
              exit 1
              ;;
            DISMISSED)
              # A human dismissed the verdict (the 5 dismissed change-requests in
              # the history all carry hand-written dismissal messages). They are
              # already engaged, so don't fail the check or page anyone — just say
              # plainly that the review no longer counts toward the approval gate.
              echo "::notice::Claude's verdict for ${HEAD_SHA} was dismissed by a human, so it no longer counts toward the required approval. Nothing to re-run; a human is already handling this PR."
              exit 0
              ;;
          esac
          echo "::error::Claude review ran but posted no verdict for ${HEAD_SHA}. Re-run the workflow to retry."
          # Surface *why* inline instead of forcing a trawl through the
          # show_full_output stream (thousands of lines): the execution file's
          # final "result" turn carries Claude's own last message plus how the
          # turn ended, which is exactly what showed PR #73's stall was Claude
          # itself saying "Waiting for the three background review agents to
          # finish before continuing" and then stopping.
          echo "::group::Claude's last turn (likely cause)"
          jq -r '
            (map(select(.type=="result")) | last) as $r
            | if $r then
                "stop subtype: \($r.subtype // "unknown")",
                "stop_reason: \($r.stop_reason // "unknown")",
                "is_error: \($r.is_error // false)",
                "num_turns: \($r.num_turns // "unknown")",
                "final message from Claude:",
                ($r.result // "(none — the run likely errored before completing a turn)")
              else
                "No \"result\" turn found in the execution output; the run likely crashed mid-stream. Check the \"Run Claude Code Review\" step log."
              end
          ' "${EXEC_FILE}" 2>/dev/null || echo "Could not parse ${EXEC_FILE} as JSON; check the \"Run Claude Code Review\" step log instead."
          echo "::endgroup::"
          exit 1

      # Two states need a human, and neither used to say so anywhere the author
      # would see it:
      #
      #   COMMENTED    - the reviewer looked but wouldn't commit to a verdict. A
      #                  comment-only review neither blocks nor unblocks, so it
      #                  sat inert with nobody notified.
      #   NOT_REVIEWED - the action self-skipped, so nothing was reviewed at all.
      #                  This reads on the PR page as a fast green `claude-review`
      #                  and is therefore worse: it looks like a pass.
      #
      # Both route the same way, because the remedy is the same — a human has to
      # review this PR. The check's colour is left alone in both cases (a neutral
      # verdict fails it, a self-skip does not, per 663c7e2); this step is about
      # making the state visible on the PR itself rather than only in a run log.
      #
      # The label is `needs-human-review`, NOT the existing `needs-human`:
      # claude-review-fix.yml treats `needs-human` on a PR as an absolute stop
      # for the auto-fixer ("a human must clear it first"), so reusing it would
      # permanently disarm automated fixes for every escalated PR.
      - name: Request human review when the bot cannot supply one
        if: >-
          always() && !cancelled() &&
          (steps.verdict.outputs.verdict == 'COMMENTED' ||
           steps.verdict.outputs.verdict == 'NOT_REVIEWED')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          # Maintainers who adjudicate judgment calls. Both repo admins, and the
          # only two humans who have ever reviewed here.
          ESCALATE_TO: "Deco354 Liconstan"
        run: |
          case "${VERDICT}" in
            NOT_REVIEWED) why="no automated review ran on this PR (the action self-skipped)" ;;
            *)            why="the automated review reached no binary verdict" ;;
          esac
          echo "Escalating: ${why}."

          # Skip maintainers who already have a pending request. This matters more
          # than it used to: NOT_REVIEWED fires on every push to a PR that edits
          # this workflow, so without deduping a long-running workflow PR would
          # re-POST the same reviewers on each push. (pr-stall-sweep.yml deduped
          # for the same reason.)
          pending=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/requested_reviewers" \
            --jq '[.users[].login] | join(" ")' 2>/dev/null || echo "")

          # GitHub also rejects a request naming the PR's own author (422), so
          # drop them too — that is why this is a list and not one name.
          reviewers=""
          for login in ${ESCALATE_TO}; do
            if [ "${login}" = "${PR_AUTHOR}" ]; then
              continue
            fi
            case " ${pending} " in
              *" ${login} "*) continue ;;
            esac
            reviewers="${reviewers} ${login}"
          done
          reviewers="$(echo "${reviewers}" | tr -s ' ' | sed 's/^ //;s/ $//')"

          gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=needs-human-review" >/dev/null 2>&1 \
            && echo "✓ Labeled needs-human-review." \
            || echo "::warning::Could not apply the needs-human-review label."

          if [ -z "${reviewers}" ]; then
            if [ -n "${pending}" ]; then
              echo "✓ ${why}; review already pending from ${pending}, so nothing to re-request."
            else
              echo "::warning::${why}, but there is no eligible reviewer to request (PR author ${PR_AUTHOR} is the only configured maintainer). The needs-human-review label is the only signal."
            fi
            exit 0
          fi
          # Re-requesting an already-pending reviewer is a harmless no-op, which
          # matters because this workflow re-runs on every push.
          args=""
          for login in ${reviewers}; do
            args="${args} -f reviewers[]=${login}"
          done
          # shellcheck disable=SC2086
          if gh api -X POST "repos/${{ github.repository }}/pulls/${PR_NUMBER}/requested_reviewers" ${args} >/dev/null 2>&1; then
            echo "✓ Requested review from: ${reviewers} (${why})"
          else
            echo "::warning::Could not request review from ${reviewers}; the needs-human-review label still stands."
          fi

